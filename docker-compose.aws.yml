version: '3.8'

# AWS App Runner / ECS Local & Cloud Architecture Specification
# Demonstrates containerized microservice design for AWS environments.

services:
  quotehub-api:
    image: public.ecr.aws/quotehub/quotehub-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ASPNETCORE_ENVIRONMENT=Production
      - DATABASE_URL=postgresql://postgres:postgres@quotehub-db:5432/quotehub
    depends_on:
      - quotehub-db

  quotehub-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quotehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
